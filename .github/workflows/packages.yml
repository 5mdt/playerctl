---
name: Packages
'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch: null
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dist:
    runs-on: ubuntu-24.04
    outputs:
      distros: ${{ steps.manifests.outputs.distros }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the source tarball and check its contents
        run: make dist dist-check
      - name: Render the package manifests
        id: manifests
        run: |
          make manifests
          echo "distros=$(cat build/packaging/matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: build/dist
      - uses: actions/upload-artifact@v4
        with:
          name: manifests
          path: build/packaging
  packages:
    needs: dist
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        distro: ${{ fromJSON(needs.dist.outputs.distros) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: build/dist
      - uses: actions/download-artifact@v4
        with:
          name: manifests
          path: build/packaging
      - name: Build, lint and install-test the package in a ${{ matrix.distro }} container
        run: make package package-lint package-test DISTRO=${{ matrix.distro }}
      - name: Name the artifact like the release files
        id: slug
        run: echo "name=$(make -s package-slug DISTRO=${{ matrix.distro }})" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.slug.outputs.name }}
          path: build/packages
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: build/dist
      - uses: actions/download-artifact@v4
        with:
          pattern: playerctl-*
          path: build/packages
          merge-multiple: true
      - name: Collect the release files
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: make release-assets
      - name: Create the release, or add the files to the one that exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            # created by hand, for example as a draft: keep its title and notes
            gh release upload "${GITHUB_REF_NAME}" build/release/* --clobber
            exit
          fi
          awk -v header="## Version ${version%%-*}" '$0 == header {found = 1; next} /^## / {found = 0} found' \
            doc/CHANGELOG.md > build/notes.md
          prerelease=
          if [[ ${version} == *-* ]]; then prerelease=--prerelease; fi
          gh release create "${GITHUB_REF_NAME}" build/release/* \
            --title "Playerctl ${version}" --notes-file build/notes.md ${prerelease}
