---

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Format and lint in the tooling image
        run: make format-check lint
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image and run the test suite
        run: make test
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run the suite against an instrumented build
        run: make coverage
      - uses: codecov/codecov-action@v5
        with:
          files: build/coverage/coverage.xml
          fail_ci_if_error: false

name: CI
'on':
  pull_request: null
  push:
    branches:
      - develop
      - main
