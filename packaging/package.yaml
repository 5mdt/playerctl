---
# The single source of truth for the package manifests and the version.
# scripts/render-packaging.py renders packaging/templates/ with these values
# (`make manifests`) and copies the version into meson.build, pyproject.toml
# and uv.lock (`make manifests-sync`). Not stored here, derived: the library
# soversion and typelib version (from the major version), the release notes
# (doc/CHANGELOG.md) and the date (SOURCE_DATE_EPOCH or the HEAD commit).
name: playerctl
version: '2.5.0'
# package revision of the version, reset to 1 on every new version
release: 1
maintainer:
  name: Vladimir Budylnikov
  email: github@nett00n.org
homepage: https://github.com/5mdt/playerctl
license: LGPL-3.0-or-later
copyright:
  - 2014-2021 Tony Crisci and the playerctl contributors (see CONTRIBUTORS.md)
  - 2025-2026 Vladimir Budylnikov
# Package descriptions: the main one is shared by the command package, the
# library ones by every format that has them
summary: command-line utility for controlling media players
# for the rpm summary and the Arch package description
summary_full: Command-line utility and library for controlling media players
description: >-
  Playerctl controls media players that implement the MPRIS D-Bus interface.
  It makes it easy to bind player actions, such as play and pause, to media
  keys, and to get metadata about the playing track for status bars and other
  tools. The playerctld daemon acts on the currently active media player.
lib_description: >-
  Playerctl library for controlling media players that implement the MPRIS
  D-Bus interface.
# passed to meson setup as -D<option>=<value>
meson_options:
  gtk-doc: false
  bash-completions: true
  zsh-completions: true
  tests: false
deb:
  build_depends:
    - debhelper-compat (= 13)
    - bash-completion
    - gir1.2-glib-2.0
    - gobject-introspection
    - libgirepository1.0-dev | libgirepository-2.0-dev
    - libglib2.0-dev
    - meson (>= 0.56.0)
    - pkgconf | pkg-config
rpm:
  build_requires:
    - gcc
    - meson
    - pkgconfig(bash-completion)
    - pkgconfig(gio-unix-2.0)
    - pkgconfig(gobject-2.0)
    - pkgconfig(gobject-introspection-1.0)
arch:
  # replaces the distribution's playerctl
  pkgname: playerctl-5mdt
  arches:
    - x86_64
    - aarch64
  depends:
    - glib2
  makedepends:
    - bash-completion
    - glib2-devel
    - gobject-introspection
    - meson
# What `make package` builds, in this order. The release file names start with
# the key. An image is one string, or one per CPU (uname -m, arm64 as aarch64).
# The install command is completed with the files of the key and type.
distros:
  fedora-43:
    title: Fedora 43
    type: rpm
    image: registry.fedoraproject.org/fedora:43
    install: sudo dnf install
  fedora-44:
    title: Fedora 44
    type: rpm
    image: registry.fedoraproject.org/fedora:44
    install: sudo dnf install
  opensuse-tumbleweed:
    title: openSUSE Tumbleweed
    type: rpm
    image: registry.opensuse.org/opensuse/tumbleweed:latest
    install: sudo zypper install
  opensuse-leap:
    title: openSUSE Leap 16.0
    type: rpm
    image: registry.opensuse.org/opensuse/leap:16.0
    install: sudo zypper install
  debian-12:
    title: Debian 12
    type: deb
    image: docker.io/library/debian:12
    install: sudo apt install
  debian-13:
    title: Debian 13
    type: deb
    image: docker.io/library/debian:13
    install: sudo apt install
  ubuntu-22.04:
    title: Ubuntu 22.04
    type: deb
    image: docker.io/library/ubuntu:22.04
    install: sudo apt install
  ubuntu-24.04:
    title: Ubuntu 24.04
    type: deb
    image: docker.io/library/ubuntu:24.04
    install: sudo apt install
  ubuntu-26.04:
    title: Ubuntu 26.04
    type: deb
    image: docker.io/library/ubuntu:26.04
    install: sudo apt install
  arch:
    title: Arch Linux
    type: arch
    image:
      x86_64: docker.io/library/archlinux:latest
      # There is no official Arch Linux ARM image, use the community one
      aarch64: docker.io/menci/archlinuxarm:latest
    install: sudo pacman -U
# package file name pattern of each type, see `distros`
package_globs:
  rpm: '*.rpm'
  deb: '*.deb'
  arch: '*.pkg.tar.zst'
